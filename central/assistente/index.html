<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Assistente</title>
<meta name="theme-color" content="#0E1110">
<link rel="manifest" href="/assistente/manifest.webmanifest">
<link rel="icon" href="/assistente/icone-192.png">
<link rel="apple-touch-icon" href="/assistente/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: conversa em coluna única, central no computador; compositor fixo embaixo com microfone grande */
  --bg:#F3F4F2;--panel:#FFFFFF;--panel-2:#F7F8F6;--ink:#111413;--muted:#5E6561;--line:#E0E3DF;
  --accent:#E8552B;--accent-soft:#FCE8E0;--ok:#1A8A5C;--warn:#B9780A;--bad:#C9362E;--info:#3360C8;--eu:#111413;--eu-ink:#F3F4F2;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,monospace;color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1110;--panel:#161A19;--panel-2:#1B201E;--ink:#E9EDEB;--muted:#9AA29E;--line:#262C2A;--accent:#FF6A3D;--accent-soft:#3A1D14;--ok:#3DC48A;--warn:#E6A93A;--bad:#F06A60;--info:#7C9CF0;--eu:#2A302E;--eu-ink:#E9EDEB;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1110;--panel:#161A19;--panel-2:#1B201E;--ink:#E9EDEB;--muted:#9AA29E;--line:#262C2A;--accent:#FF6A3D;--accent-soft:#3A1D14;--ok:#3DC48A;--warn:#E6A93A;--bad:#F06A60;--info:#7C9CF0;--eu:#2A302E;--eu-ink:#E9EDEB;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%;height:100dvh;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:10px}
.marca .ic{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.marca .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2}
.marca b{display:block;font-size:15px}
.marca small{display:block;font-size:12px;color:var(--muted)}
.topo-acoes{display:flex;gap:6px}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ibtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#conversa{overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:88%;display:grid;gap:8px;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.eu{align-self:flex-end;background:var(--eu);color:var(--eu-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.msg.ele{align-self:flex-start;width:min(100%,640px);min-width:0}
.bolha{min-width:0;overflow-wrap:anywhere}
.bolha{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;display:grid;gap:8px}
.bolha p{margin:0}
.bolha h3{margin:0;font-size:15px}
.lista{display:grid;gap:0}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.it:last-child{border-bottom:0}
.it .h{font:600 13px var(--mono);min-width:44px}
.it small{display:block;color:var(--muted);font-size:12.5px}
.tag{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:6px;color:#fff;background:var(--muted);white-space:nowrap}
.t-ok{background:var(--ok)}.t-warn{background:var(--warn)}.t-bad{background:var(--bad)}.t-info{background:var(--info)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{background:var(--panel-2);padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font:600 18px var(--mono)}
.sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
ol.passos{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:#1F9E5A;border-color:#1F9E5A;color:#fff}
.btn:disabled{opacity:.5}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.prev{white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.sub{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.compositor{border-top:1px solid var(--line);padding-top:10px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.linha{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;padding:0 16px}
#entrada{resize:none;max-height:140px;min-height:46px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:11px 13px;line-height:1.4}
#entrada:focus{outline:none;border-color:var(--accent)}
.mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
.mic.ouvindo::before,.mic.ouvindo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:onda 1.6s ease-out infinite}
.mic.ouvindo::after{animation-delay:.8s}
@keyframes onda{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.enviar{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.enviar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.status-voz{text-align:center;font-size:12.5px;color:var(--muted);min-height:18px;padding:2px 16px 0}
.login{display:grid;place-items:center;height:100%;padding:24px}
.login form{width:min(360px,100%);display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.login input{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 12px}
.login h1{margin:0 0 6px;font-size:20px}
@media (min-width:900px){#conversa{padding:24px 24px 8px}.msg{max-width:75%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section class="login" id="tela-login" hidden>
  <form id="form-login" novalidate>
    <h1>Assistente</h1>
    <p class="sub">Entre com a mesma conta da Central.</p>
    <input id="l-email" type="email" placeholder="E-mail" autocomplete="username" aria-label="E-mail">
    <input id="l-senha" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
    <button class="btn pri" type="submit" style="justify-content:center;padding:11px">Entrar</button>
    <p class="sub" id="l-msg" role="alert"></p>
  </form>
</section>
<div class="app" id="tela-app" hidden>
  <header>
    <div class="marca"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg></span><span><b>Assistente</b><small id="sub-topo">Pergunte ou peça por voz</small></span></div>
    <div class="topo-acoes">
      <button class="ibtn" type="button" id="b-voz" aria-pressed="false" aria-label="Ler as respostas em voz alta" title="Ler as respostas em voz alta"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
      <a class="ibtn" href="/" aria-label="Abrir a Central" title="Abrir a Central"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
    </div>
  </header>
  <main id="conversa" aria-live="polite"></main>
  <div class="compositor">
    <div class="chips" id="chips"></div>
    <div class="linha">
      <button class="mic" type="button" id="b-mic" aria-label="Falar"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/></svg></button>
      <textarea id="entrada" rows="1" placeholder="Pergunte algo ou diga o que aconteceu" aria-label="Mensagem"></textarea>
      <button class="enviar" type="button" id="b-enviar" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></button>
    </div>
    <div class="status-voz" id="status-voz"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/nucleo.js"></script>
<script src="/assistente/assistente.js"></script>
</body>
</html>
