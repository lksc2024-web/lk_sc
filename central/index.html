<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central</title>
<meta name="description" content="Central de controle dos seus projetos, serviços, clientes e prospecção.">
<meta name="theme-color" content="#121615">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ENTRADA -->
<section id="tela-login" class="login" hidden>
  <canvas id="login-3d" aria-hidden="true"></canvas>
  <div class="login-veil" aria-hidden="true"></div>
  <div class="login-box">
    <div class="brand-row"><span class="mark"><i></i><i></i><i></i></span><span><b>Central</b><small>Projetos · Clientes · Prospecção</small></span></div>
    <h1>Tudo o que você vende, num lugar só.</h1>
    <p class="login-sub">Entre para ver resultados, leads e clientes em tempo real.</p>
    <button type="button" class="btn-google" id="btn-google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.8 2.4 2.6 6.6 2.6 11.9s4.2 9.5 9.4 9.5c5.4 0 9-3.8 9-9.2 0-.6-.1-1.1-.2-1.6H12z"/></svg>Entrar com Google</button>
    <div class="ou"><span>ou com e-mail</span></div>
    <form id="form-login" novalidate>
      <label for="l-email">E-mail</label>
      <input id="l-email" type="email" autocomplete="username" required>
      <label for="l-senha">Senha</label>
      <input id="l-senha" type="password" autocomplete="current-password" required>
      <button class="btn pri full" type="submit" id="btn-entrar">Entrar</button>
      <p class="login-msg" id="login-msg" role="alert"></p>
    </form>
    <p class="login-foot">Mesma conta do app de Prospecção.</p>
  </div>
</section>

<!-- APP -->
<div id="tela-app" class="app" hidden>
  <aside class="side" aria-label="Navegação">
    <div class="brand-row"><span class="mark"><i></i><i></i><i></i></span><span><b>Central</b><small id="side-nome">—</small></span></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">
      <button type="button" class="side-btn" id="btn-sair"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="tb-left"><h1 id="vt">Visão geral</h1><span class="live" id="live"><i></i>Ao vivo</span></div>
      <div class="tb-right" id="tb-right">
        <div class="seg" id="seg-dias" role="group" aria-label="Período">
          <button type="button" data-d="7">7d</button><button type="button" data-d="30" aria-pressed="true">30d</button><button type="button" data-d="90">90d</button><button type="button" data-d="365">12m</button>
        </div>
        <button class="btn" type="button" id="btn-custom" hidden><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Personalizar</span></button>
        <button class="btn pri" type="button" id="btn-acao" hidden></button>
      </div>
    </header>
    <main class="content" id="conteudo"></main>
  </div>
  <nav class="bottom" id="bottom" aria-label="Navegação"></nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-fechar></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-t">
    <header><h2 id="modal-t">—</h2><button type="button" class="x" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<button type="button" class="fab" id="fab-voz" hidden aria-label="Falar com o assistente"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="boot" id="boot"><span class="mark big"><i></i><i></i><i></i></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="/cena3d.js"></script>
<script src="/nucleo.js"></script>
<script src="/app.js"></script>
</body>
</html>
