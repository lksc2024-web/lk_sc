<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prévia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cor: #334155; --tinta: #16181d; --sub: #5d6470; --fundo: #f7f5f1; --cartao: #ffffff; --linha: #e6e1d8; --raio: 14px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: Manrope, system-ui, sans-serif; color: var(--tinta); background: var(--fundo); line-height: 1.5; overflow-x: hidden; }
  h1, h2, .marca { font-family: Fraunces, Georgia, serif; font-weight: 650; letter-spacing: -0.01em; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .topo { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }

  .marca { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selo { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cor); border: 1px solid currentColor; border-radius: 99px; padding: 3px 9px; }
  .hero { padding: 40px 0 28px; }
  .olho { font-size: 13px; font-weight: 600; color: var(--cor); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  h1 { font-size: clamp(30px, 8vw, 46px); line-height: 1.08; margin: 0 0 14px; }
  .hero p.sub { font-size: 17px; color: var(--sub); margin: 0 0 20px; max-width: 34ch; }
  .nota { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; background: var(--cartao); border: 1px solid var(--linha); border-radius: 99px; padding: 6px 12px; margin: 0 0 22px; }
  .nota b { color: #b7791f; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0; font: 600 16px Manrope, sans-serif; cursor: pointer; text-decoration: none; }
  .btn.pri { background: var(--cor); color: #fff; }
  .btn.sec { background: var(--cartao); color: var(--tinta); border: 1px solid var(--linha); }
  .btn.cheio { width: 100%; }
  section { padding: 26px 0; }
  h2 { font-size: 26px; margin: 0 0 6px; }
  .dica { color: var(--sub); font-size: 15px; margin: 0 0 16px; }
  .itens { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item { text-align: left; background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 14px; font: 600 15px Manrope, sans-serif; color: var(--tinta); cursor: pointer; min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .item small { font-weight: 500; color: var(--sub); font-size: 13px; }
  .item[aria-pressed="true"] { border-color: var(--cor); box-shadow: inset 0 0 0 1px var(--cor); }
  .foto { aspect-ratio: 4 / 3; border-radius: 10px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--cor) 10%, #fff) 0 10px, color-mix(in srgb, var(--cor) 16%, #fff) 10px 20px); display: grid; place-items: center; font-size: 12px; color: var(--sub); font-weight: 600; }
  .qtd { display: flex; align-items: center; gap: 10px; }
  .qtd button { width: 34px; height: 34px; border-radius: 99px; border: 1px solid var(--linha); background: var(--fundo); font: 700 18px Manrope; cursor: pointer; color: var(--tinta); }
  .painel { background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 20px; }
  .rotulo { display: block; font-size: 14px; font-weight: 700; margin: 16px 0 8px; }
  .rotulo:first-child { margin-top: 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--linha); background: var(--fundo); border-radius: 10px; padding: 10px 14px; font: 600 14px Manrope, sans-serif; cursor: pointer; color: var(--tinta); text-align: center; }
  .chip small { display: block; font-weight: 500; color: var(--sub); font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--cor); color: #fff; border-color: var(--cor); }
  .chip[aria-pressed="true"] small { color: #ffffffcc; }
  input, textarea, select { width: 100%; font: 500 16px Manrope, sans-serif; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 10px; background: var(--fundo); color: var(--tinta); }
  input:focus, textarea:focus, .item:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--cor); outline-offset: 2px; }
  .anexo { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--linha); border-radius: 10px; padding: 12px 14px; color: var(--sub); font-size: 14px; cursor: pointer; background: var(--fundo); width: 100%; font-family: inherit; text-align: left; }
  .resultado { margin-top: 18px; display: none; }
  .resultado.on { display: block; }
  .zap { background: #e7f6e9; border-radius: 16px; padding: 14px; }
  .zap .cab { font-size: 12px; font-weight: 700; color: #2f6b3a; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .bolha { background: #d9fdd3; border-radius: 12px 12px 4px 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 15px; box-shadow: 0 1px 0 #0000000d; margin-left: auto; max-width: 92%; }
  .nota-final { font-size: 13px; color: var(--sub); margin: 10px 0 0; }
  .passos { counter-reset: p; display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .passos li { counter-increment: p; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .passos li::before { content: counter(p); width: 36px; height: 36px; border-radius: 99px; background: color-mix(in srgb, var(--cor) 14%, #fff); color: var(--cor); font-weight: 700; display: grid; place-items: center; }
  .passos b { display: block; }
  .passos span { color: var(--sub); font-size: 15px; }
  .horario { margin: 0; padding: 0; list-style: none; font-size: 15px; }
  .horario li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .horario li:last-child { border: 0; }
  footer { padding: 30px 0 120px; font-size: 13px; color: var(--sub); border-top: 1px solid var(--linha); margin-top: 10px; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #121316; color: #fff; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  .barra .wrap { display: flex; align-items: center; gap: 10px; }
  .barra p { margin: 0; flex: 1; font-size: 13px; line-height: 1.35; min-width: 0; }
  .barra p b { display: block; font-size: 14px; }
  .barra .btn { min-height: 42px; padding: 0 14px; font-size: 14px; }
  .barra .btn.pdf { background: transparent; color: #fff; border: 1px solid #ffffff55; }
  .barra .btn.quero { background: #25d366; color: #0b2e13; }
  .carregando { min-height: 70vh; display: grid; place-items: center; color: var(--sub); text-align: center; padding: 20px; }
  .marca-visual { margin: 24px 0 8px; border-radius: 22px; aspect-ratio: 16 / 10; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--cor) 55%, #fff) 0%, transparent 55%), linear-gradient(160deg, color-mix(in srgb, var(--cor) 92%, #000), var(--cor)); display: grid; place-items: center; }
  .marca-visual::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #ffffff10 0 2px, transparent 2px 22px); }
  .marca-visual span { font-family: Fraunces, Georgia, serif; font-size: clamp(64px, 22vw, 120px); color: #fff; letter-spacing: -0.04em; position: relative; }
  .marca-visual small { position: absolute; left: 18px; bottom: 14px; color: #ffffffcc; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .sobre p { font-size: 17px; margin: 0; }
  /* estilos */
  body.escuro { --fundo: #111214; --cartao: #1a1c20; --tinta: #f4f2ee; --sub: #a9aeb6; --linha: #2b2e34; }
  body.escuro .zap { background: #16261a; } body.escuro .bolha { background: #1f4d2b; color: #f1f7ef; } body.escuro .zap .cab { color: #8fd19e; }
  body.escuro .selo { color: #f4f2ee; } body.escuro .barra { border-top: 1px solid #2b2e34; }
  body.elegante { --fundo: #f4f0e8; --cartao: #fbf9f4; --linha: #e2dbcd; }
  body.elegante h1 { font-weight: 500; letter-spacing: -0.02em; } body.elegante h2 { font-weight: 500; }
  body.elegante .olho { letter-spacing: .18em; font-size: 12px; } body.elegante .btn { border-radius: 2px; } body.elegante .item, body.elegante .painel { border-radius: 4px; }
  /* capa com foto */
  .capa { position: relative; min-height: 78vh; display: flex; align-items: flex-end; color: #fff; overflow: hidden; background: #222; }
  .capa > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0000 25%, #000000b8 85%); }
  .capa .wrap { position: relative; z-index: 1; padding-top: 120px; padding-bottom: 34px; width: 100%; }
  .capa .olho { color: #fff; opacity: .9; } .capa p.sub { color: #ffffffd9; } .capa .nota { background: #ffffffe6; color: #16181d; border: 0; }
  .credito { position: absolute; right: 10px; bottom: 8px; z-index: 2; font-size: 10px; color: #ffffffb3; }
  .galeria { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
  .galeria::-webkit-scrollbar { display: none; }
  .galeria figure { flex: 0 0 78%; margin: 0; scroll-snap-align: start; position: relative; border-radius: var(--raio); overflow: hidden; aspect-ratio: 4 / 3; background: var(--linha); }
  .galeria img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .galeria figcaption { position: absolute; left: 8px; bottom: 6px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
  @media (min-width: 640px) { .galeria figure { flex-basis: 46%; } }
  @media (min-width: 640px) { .itens { grid-template-columns: repeat(4, 1fr); } }
  @media print {
    .topo, .barra, .resultado, button.btn { display: none !important; }
    body { background: #fff; }
    section { break-inside: avoid; }
    footer { padding-bottom: 0; }
  }
</style>

<div id="app"><div class="carregando">Carregando a prévia…</div></div>
<script>
"use strict";
const SUPABASE_URL = "https://bxjyxfoisqjkijxoeysu.supabase.co";
const SUPABASE_KEY = "sb_publishable_em9lB9ZwTDvfHV3kds9jpg_D0oxdWJA";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const slug = (location.pathname.match(/\/p\/([a-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get("s") || "";

const PASSOS = {
  agenda: [["Escolhe o serviço", "Tudo o que vocês fazem, num lugar só."], ["Escolhe dia e horário", "A qualquer hora, até de madrugada."], ["O pedido chega no WhatsApp", "Já com nome, serviço e horário. Vocês só confirmam."]],
  orcamento: [["Conta o que precisa", "Em poucos campos, sem conversa longa."], ["Manda as informações", "Os dados que vocês sempre precisam perguntar."], ["O pedido chega completo", "Direto no WhatsApp, pronto para responder."]],
  catalogo: [["Vê os produtos", "Sem precisar perguntar o que tem."], ["Monta o pedido", "Escolhe as quantidades."], ["O pedido chega pronto", "No WhatsApp de vocês, com tudo listado."]],
  reserva: [["Escolhe as datas", "E quantas pessoas vêm."], ["Escolhe a acomodação", "Vendo o que está disponível."], ["A reserva chega no WhatsApp", "Direto com vocês, sem comissão."]],
};
const SUB = {
  agenda: "Escolha o serviço e o horário em poucos toques. A confirmação chega pelo WhatsApp.",
  orcamento: "Conte o que você precisa em poucos campos e receba a resposta pelo WhatsApp.",
  catalogo: "Veja o que temos, monte seu pedido e mande pelo WhatsApp.",
  reserva: "Escolha as datas e reserve direto com a gente, pelo WhatsApp.",
};

// Dias e horários da agenda: os que a empresa abre de verdade (horário do Google). Sem horário, segunda a sábado em horário comercial.
const DIAS_NOME = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
function expediente(horario) {
  const mapa = {};
  for (const h of horario || []) {
    const [dia, resto = ""] = String(h).split(/:\s(.+)/);
    const idx = DIAS_NOME.findIndex((n) => dia.toLowerCase().startsWith(n));
    if (idx < 0) continue;
    const faixas = [...resto.matchAll(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/g)].map((m) => [+m[1] * 60 + +m[2], (+m[3] || 24) * 60 + +m[4]]);
    if (/24 horas|aberto 24/i.test(resto)) faixas.push([8 * 60, 20 * 60]);
    mapa[idx] = faixas;
  }
  return Object.keys(mapa).length ? mapa : null;
}
let EXP = null;
function dias() {
  const nomes = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], out = [];
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 1; out.length < 6 && i < 15; i++) {
    const x = new Date(d); x.setDate(d.getDate() + i);
    const abre = EXP ? (EXP[x.getDay()] || []).length > 0 : x.getDay() !== 0;
    if (!abre) continue;
    out.push({ rot: nomes[x.getDay()], dia: `${String(x.getDate()).padStart(2, "0")}/${String(x.getMonth() + 1).padStart(2, "0")}`, dow: x.getDay() });
  }
  return out;
}
const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
function horasDo(dow) {
  const faixas = EXP ? EXP[dow] || [] : [[9 * 60, 18 * 60]];
  const total = faixas.reduce((a, [ini, fim]) => a + Math.max(0, fim - ini), 0), passo = total <= 240 ? 30 : 90, out = [];
  for (const [ini, fim] of faixas) for (let m = Math.ceil(ini / 30) * 30; m + 30 <= fim; m += passo) out.push(hm(m));
  return out.slice(0, 8);
}
// "quintas e sextas à noite e nos fins de semana" a partir do horário
function quandoAtende() {
  if (!EXP) return "";
  const abertos = Object.keys(EXP).map(Number).filter((k) => (EXP[k] || []).length);
  if (abertos.length >= 6) return "";
  const plural = ["domingos", "segundas", "terças", "quartas", "quintas", "sextas", "sábados"];
  const fds = abertos.includes(0) && abertos.includes(6), uteis = abertos.filter((k) => k > 0 && k < 6);
  const noite = (k) => (EXP[k] || []).every(([ini]) => ini >= 17 * 60);
  const partes = [];
  if (uteis.length) partes.push(uteis.map((k) => plural[k]).join(", ").replace(/, ([^,]*)$/, " e $1") + (uteis.every(noite) ? " à noite" : ""));
  if (fds) partes.push("nos fins de semana"); else for (const k of [6, 0]) if (abertos.includes(k)) partes.push(plural[k] === "sábados" ? "aos sábados" : "aos domingos");
  return partes.join(" e ");
}

const chipsHoras = (dow) => horasDo(dow).map((h) => `<button class="chip" type="button" data-hora="${h}" aria-pressed="false">${h}</button>`).join("");
function render(d) {
  EXP = expediente(d.horario);
  document.title = `${d.nome} · prévia`;
  document.documentElement.style.setProperty("--cor", d.cor || "#334155");
  document.body.className = ["escuro", "elegante"].includes(d.estilo) ? d.estilo : "";
  const fotos = (d.fotos || []).filter((f) => f && /^https:\/\//.test(f.url));
  const credito = (f) => f.fonte === "google" ? `Foto: Google Maps${f.autor ? " · " + esc(f.autor) : ""}` : f.fonte === "site" ? "Foto: site da empresa" : "";
  const img = (f, extra = "") => `<img src="${esc(f.url)}" alt="" ${extra} referrerpolicy="no-referrer" onerror="var g=this.closest('figure'); if (g) g.remove(); else this.remove();">`;
  const lugar = [d.bairro, d.cidade].filter(Boolean).join(", ");
  const autor = d.autor?.nome || d.autor?.marca || "";
  const st = { item: d.tipo === "catalogo" ? null : d.itens[0], qtd: {}, dia: null, hora: null, foto: false };
  const itensHtml = d.itens.map((it, i) => d.tipo === "catalogo"
    ? `<div class="item" data-i="${i}"><div class="foto">foto</div><span>${esc(it)}</span><small>preço de vocês</small>
        <div class="qtd"><button type="button" data-menos="${i}" aria-label="Menos ${esc(it)}">−</button><b data-q="${i}">0</b><button type="button" data-mais="${i}" aria-label="Mais ${esc(it)}">+</button></div></div>`
    : `<button class="item" type="button" data-item="${i}" aria-pressed="${i === 0}"><span>${esc(it)}</span><small>${d.tipo === "agenda" ? "toque para escolher" : "selecionar"}</small></button>`).join("");
  const campos = (d.campos || []).map((c, i) => `<label class="rotulo" for="c${i}">${esc(c)}</label><input id="c${i}" data-campo="${esc(c)}" ${/data|chegada|sa[ií]da/i.test(c) ? 'type="date"' : /convidados|h[oó]spedes|pessoas|m²/i.test(c) ? 'type="number" inputmode="numeric" min="1"' : 'type="text"'}>`).join("");
  const agenda = d.tipo === "agenda" ? `
      <span class="rotulo">Dia</span><div class="chips" id="dias">${dias().map((x) => `<button class="chip" type="button" data-dia="${x.rot}, ${x.dia}" aria-pressed="false">${x.rot}<small>${x.dia}</small></button>`).join("")}</div>
      <span class="rotulo">Horário</span><div class="chips" id="horas">${chipsHoras(dias()[0]?.dow)}</div>` : "";
  const foto = d.foto ? `<span class="rotulo">Foto ou referência</span><button class="anexo" type="button" id="anexo">＋ Anexar foto do ambiente ou de uma referência</button>` : "";

  const heroInner = `
      <p class="olho">${esc(d.categoria)}${lugar ? ` · ${esc(lugar)}` : ""}</p>
      <h1>${esc(d.titulo)}</h1>
      <p class="sub">${esc(d.sub || SUB[d.tipo] || SUB.orcamento)}</p>
      ${d.nota >= 4 && d.avaliacoes >= 3 ? `<div class="nota"><b>★ ${String(d.nota).replace(".", ",")}</b> ${d.avaliacoes} avaliações no Google</div><br>` : ""}
      <a class="btn pri" href="#pedido">${esc(d.acao)}</a>`;
  // "PretaJan Beleza e Estética" -> PJ; "Studio Bella" -> SB; palavras do ramo (beleza, estética, marcenaria...) ficam de fora
  const GEN = /^(e|de|da|do|das|dos|beleza|estetica|estética|studio|estudio|estúdio|salao|salão|clinica|clínica|espaco|espaço|centro|marcenaria|buffet|pet|shop|ltda|me|eireli|&)$/i;
  const palavras = d.nome.split(/[\s-]+/).filter(Boolean), marca = palavras.filter((w) => !GEN.test(w));
  const camel = (marca[0] || "").match(/[A-ZÀ-Ú]/g) || [];
  const iniciais = (camel.length >= 2 ? camel.slice(0, 2).join("") : (marca.length >= 2 ? marca.slice(0, 2) : palavras.slice(0, 2)).map((w) => w[0].toUpperCase()).join("")) || d.nome[0];
  const heroHtml = `<section class="hero">${heroInner}<div class="marca-visual" aria-hidden="true"><span>${esc(iniciais)}</span><small>${esc(d.categoria)}${d.bairro ? " · " + esc(d.bairro) : ""}</small></div></section>`;
  const quando = quandoAtende();
  const sobre = `<section class="sobre"><h2>Sobre ${esc(d.nome)}</h2><p>${esc(d.categoria)}${d.bairro ? ` em ${esc(d.bairro)}` : ""}${quando ? `, com atendimento ${esc(quando)}` : ""}. ${d.tipo === "agenda" ? "Atendimento com hora marcada: você escolhe o horário e chega com a vaga garantida." : "Você manda o que precisa e recebe a resposta sem precisar ligar."}</p><p class="dica" style="margin-top:8px">Na versão final, este espaço conta a história de vocês, com as fotos do espaço e do trabalho.</p></section>`;
  const capaHtml = fotos.length ? `<section class="capa">${img(fotos[0], 'fetchpriority="high"')}<div class="wrap">${heroInner}</div>${credito(fotos[0]) ? `<span class="credito">${credito(fotos[0])}</span>` : ""}</section>` : "";
  const galeria = fotos.length > 1 ? `<section><h2>Fotos</h2><p class="dica">${fotos.some((f) => f.fonte === "google") ? "Do perfil de vocês no Google." : "Do site de vocês."} Na versão final, entram as fotos que vocês escolherem.</p>
      <div class="galeria">${fotos.slice(1).map((f) => `<figure>${img(f, 'loading="lazy"')}${credito(f) ? `<figcaption>${credito(f)}</figcaption>` : ""}</figure>`).join("")}</div></section>` : "";
  $("#app").innerHTML = `
  <header class="topo"><div class="wrap"><span class="marca">${esc(d.nome)}</span><span class="selo">Prévia</span></div></header>
  ${capaHtml}
  <main class="wrap">
    ${fotos.length ? "" : heroHtml}

    <section>
      <h2>${d.tipo === "catalogo" ? "O que vocês oferecem" : "Serviços"}</h2>
      <p class="dica">${d.tipo === "catalogo" ? "Exemplos de itens. Na versão final entram os produtos, as fotos e os preços de vocês." : "Exemplos. Na versão final entram os serviços de vocês."}</p>
      <div class="itens">${itensHtml}</div>
    </section>

    ${galeria}
    ${sobre}

    <section id="pedido">
      <h2>${esc(d.acao)}</h2>
      <p class="dica">Experimente como o cliente de vocês faria.</p>
      <div class="painel">
        ${agenda}${campos}${foto}
        <label class="rotulo" for="nome">Seu nome</label><input id="nome" type="text" autocomplete="name">
        <button class="btn pri cheio" type="button" id="enviar" style="margin-top:18px">Enviar pelo WhatsApp</button>
        <div class="resultado" id="resultado" aria-live="polite">
          <div class="zap"><p class="cab">Assim o pedido chega no WhatsApp de vocês</p><div class="bolha" id="bolha"></div></div>
          <p class="nota-final">Na versão final, ao tocar no botão, o WhatsApp do cliente abre com essa mensagem pronta para ${esc(d.nome)}.</p>
        </div>
      </div>
    </section>

    <section>
      <h2>Como funciona</h2>
      <ol class="passos">${(PASSOS[d.tipo] || PASSOS.orcamento).map(([t, s]) => `<li><div><b>${esc(t)}</b><span>${esc(s)}</span></div></li>`).join("")}</ol>
    </section>

    ${d.horario?.length || d.maps ? `<section>
      <h2>Onde e quando</h2>
      ${d.horario?.length ? `<ul class="horario">${d.horario.map((h) => { const [dia, ...r] = String(h).split(": "); return `<li><span>${esc(dia)}</span><span>${esc(r.join(": "))}</span></li>`; }).join("")}</ul>` : ""}
      ${d.maps ? `<a class="btn sec" style="margin-top:14px" href="${esc(d.maps)}" target="_blank" rel="noopener">Ver no mapa</a>` : ""}
    </section>` : ""}
  </main>
  <footer><div class="wrap">Prévia de demonstração${autor ? ` feita por ${esc(autor)}` : ""} para ${esc(d.nome)}, com os dados públicos do Google. Fotos, textos, preços e cores entram com o material de vocês.</div></footer>
  <div class="barra"><div class="wrap">
    <p><b>Gostou da ideia?</b>${autor ? `Fale com ${esc(autor)}` : "Fale comigo"} pelo WhatsApp.</p>
    <button class="btn pdf" type="button" id="pdf">PDF</button>
    ${d.autor?.whatsapp ? `<a class="btn quero" target="_blank" rel="noopener" href="https://wa.me/${esc(d.autor.whatsapp)}?text=${encodeURIComponent(`Oi${d.autor.nome ? ", " + d.autor.nome : ""}! Vi a prévia da ${d.nome} e quero conversar.`)}">Quero</a>` : ""}
  </div></div>`;

  // interação
  $$("[data-item]").forEach((b) => b.addEventListener("click", () => {
    $$("[data-item]").forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); st.item = d.itens[+b.dataset.item];
  }));
  const muda = (i, delta) => { st.qtd[i] = Math.max(0, (st.qtd[i] || 0) + delta); $(`[data-q="${i}"]`).textContent = st.qtd[i]; };
  $$("[data-mais]").forEach((b) => b.addEventListener("click", () => muda(+b.dataset.mais, 1)));
  $$("[data-menos]").forEach((b) => b.addEventListener("click", () => muda(+b.dataset.menos, -1)));
  const grupo = (sel, attr, chave) => $$(sel).forEach((b) => b.addEventListener("click", () => {
    $$(sel).forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); st[chave] = b.dataset[attr];
  }));
  grupo("[data-dia]", "dia", "dia"); grupo("[data-hora]", "hora", "hora");
  // ao trocar o dia, os horários passam a ser os daquele dia
  $$("[data-dia]").forEach((b) => b.addEventListener("click", () => { const dw = dias().find((x) => `${x.rot}, ${x.dia}` === b.dataset.dia)?.dow; $("#horas").innerHTML = chipsHoras(dw); st.hora = null; grupo("[data-hora]", "hora", "hora"); }));
  $("#anexo")?.addEventListener("click", (e) => { st.foto = true; e.currentTarget.textContent = "✓ 1 foto anexada (exemplo)"; });
  $("#pdf").addEventListener("click", () => window.print());
  $("#enviar").addEventListener("click", () => {
    const linhas = [];
    const nome = $("#nome").value.trim();
    if (d.tipo === "catalogo") {
      const lista = d.itens.map((it, i) => (st.qtd[i] ? `• ${st.qtd[i]}x ${it}` : "")).filter(Boolean);
      linhas.push("Olá! Quero fazer um pedido:", ...(lista.length ? lista : [`• 1x ${d.itens[0]}`]));
    } else if (d.tipo === "agenda") {
      linhas.push(`Olá! Quero agendar: *${st.item}*`, `Dia: ${st.dia || dias()[0].rot + ", " + dias()[0].dia} às ${st.hora || horasDo(dias()[0].dow)[0] || "a combinar"}`);
    } else if (d.tipo === "reserva") {
      linhas.push(`Olá! Quero reservar: *${st.item}*`);
    } else {
      linhas.push(`Olá! Quero um orçamento: *${st.item}*`);
    }
    $$("[data-campo]").forEach((i) => { if (i.value) linhas.push(`${i.dataset.campo}: ${i.type === "date" ? i.value.split("-").reverse().join("/") : i.value}`); });
    if (st.foto) linhas.push("📎 1 foto anexada");
    linhas.push(`Nome: ${nome || "Cliente"}`, "", `(pela página da ${d.nome})`);
    $("#bolha").textContent = linhas.join("\n");
    $("#resultado").classList.add("on");
    $("#resultado").scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

async function iniciar() {
  if (!slug) { $("#app").innerHTML = `<div class="carregando">Prévia não encontrada.</div>`; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/previas?slug=eq.${encodeURIComponent(slug)}&select=dados`, { headers: { apikey: SUPABASE_KEY } });
    const [linha] = r.ok ? await r.json() : [];
    if (!linha) { $("#app").innerHTML = `<div class="carregando">Prévia não encontrada.</div>`; return; }
    render(linha.dados);
    let visto = false; try { visto = sessionStorage.getItem("pv-" + slug); sessionStorage.setItem("pv-" + slug, "1"); } catch (e) {}
    if (!visto && !/[?&]eu\b/.test(location.search)) fetch(`${SUPABASE_URL}/rest/v1/rpc/previa_vista`, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_slug: slug }) }).catch(() => {});
  } catch (e) {
    $("#app").innerHTML = `<div class="carregando">Não deu para carregar a prévia. Verifique a internet e tente de novo.</div>`;
  }
}
iniciar();
</script>
</body>
</html>
