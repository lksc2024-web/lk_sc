<title>Simões Imobiliária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: editorial single column on phones; image-led hero, filter rail + card grid from 900px. Forest-and-lagoon palette drawn from the Maciço da Pedra Branca. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --ink:#15211d; --muted:#5b6862; --line:#d9ddd5;
  --forest:#1d3a32; --lagoon:#2f6f68; --brass:#a87b33; --brass-soft:#efe3cc;
  --on-dark:#f4f1ea; --scrim:rgba(10,18,15,.62); --shadow:0 18px 40px -22px rgba(15,30,25,.45);
  --wa:#1f8f55;
  --f-display:"Gloock","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --gut:clamp(16px,4.5vw,40px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --ink:#eaece6; --muted:#9daaa3; --line:#283631;
  --forest:#cfe0d6; --lagoon:#6fb5ab; --brass:#d3a55a; --brass-soft:#2e2718;
  --scrim:rgba(4,8,7,.72); --shadow:0 18px 40px -22px rgba(0,0,0,.8); --wa:#2aa866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --ink:#eaece6; --muted:#9daaa3; --line:#283631;
  --forest:#cfe0d6; --lagoon:#6fb5ab; --brass:#d3a55a; --brass-soft:#2e2718;
  --scrim:rgba(4,8,7,.72); --shadow:0 18px 40px -22px rgba(0,0,0,.8); --wa:#2aa866; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--lagoon)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section[id]{scroll-margin-top:84px}

/* demo ribbon + header */
.ribbon{background:var(--forest);color:var(--bg);font-size:.75rem;text-align:center;padding:7px 16px;letter-spacing:.02em}
.ribbon b{font-weight:700}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.mark{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem;color:var(--brass)}
.brand-t{display:flex;flex-direction:column;line-height:1;text-align:left}
.brand-t strong{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.brand-t small{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:none;gap:28px;align-items:center}
.nav button{background:none;border:0;cursor:pointer;font-size:.9rem;color:var(--muted);padding:6px 0}
.nav button:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:12px 20px;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;transition:transform .2s ease,background .2s ease,border-color .2s}
.btn:active{transform:scale(.98)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.06)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-ghost:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px;flex:none}
.menu-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.hdr-cta{display:none}
.drawer{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gut) 32px;display:flex;flex-direction:column;gap:8px;animation:fade .25s ease}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer nav button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0;font-family:var(--f-display);font-size:1.9rem;cursor:pointer}
.drawer .btn{margin-top:auto}
@media (min-width:900px){.nav{display:flex}.menu-btn{display:none}.hdr-cta{display:inline-flex}}

/* hero */
.hero{position:relative;overflow:hidden;background:#101915;color:var(--on-dark);isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 26s ease-out both}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,14,12,.35) 0%,rgba(8,14,12,0) 30%,rgba(8,14,12,.25) 55%,rgba(8,14,12,.86) 100%)}
.hero .wrap{padding-block:min(34vh,300px) 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (max-width:719px){.hero-img{bottom:auto;height:auto;aspect-ratio:4/3;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}.hero::after{background:linear-gradient(180deg,rgba(8,14,12,.25) 0%,rgba(8,14,12,0) 25%,rgba(8,14,12,.55) 62%,rgba(8,14,12,.2) 100%)}.hero .wrap{padding-top:calc(75vw - 120px)}}
.hero h1{font-size:clamp(2.5rem,9vw,5.2rem);max-width:13ch;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 em{font-style:italic;color:#e9c98f}
.hero p.lead{max-width:44ch;font-size:1.02rem;color:rgba(244,241,234,.86);margin:0;animation:rise .9s .12s cubic-bezier(.2,.7,.2,1) both}
.hero .eyebrow{color:#e9c98f}
.feat{display:flex;align-items:center;gap:12px;background:rgba(10,18,15,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 12px 10px 14px;max-width:440px;cursor:pointer;color:inherit;text-align:left;animation:rise .9s .22s cubic-bezier(.2,.7,.2,1) both}
.feat:hover{border-color:rgba(255,255,255,.4)}
.feat-txt{flex:1;min-width:0}
.feat-txt small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#e9c98f}
.feat-txt span{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-arrow{width:34px;height:34px;border-radius:50%;background:#f4f1ea;color:#15211d;display:grid;place-items:center;flex:none}
.img-note{position:absolute;right:var(--gut);top:14px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,241,234,.7);font-family:var(--f-mono)}

/* search panel */
.search{position:relative;z-index:5;margin-top:-1px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;display:grid;gap:12px;color:var(--ink)}
.search-wrap{margin-top:-34px;position:relative;z-index:6}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--bg);border-radius:999px;padding:4px;gap:4px;justify-self:start}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fields{display:grid;gap:10px;grid-template-columns:1fr}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 12px;font-size:1rem;appearance:none;-webkit-appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field select:disabled{opacity:.55}
.search .btn{width:100%;padding:14px}
@media (min-width:720px){.fields{grid-template-columns:1.2fr 1fr auto;align-items:end}.search .btn{width:auto}}

/* listings */
.listings{padding-block:64px 40px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.sec-head h2{font-size:clamp(2rem,6vw,3.2rem)}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:calc(var(--gut)*-1);padding-inline:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--bg)}
.filterbar{display:grid;gap:14px;margin-bottom:18px}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filter-row .field:first-child{grid-column:1/-1}
@media (min-width:720px){.filter-row{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}.filter-row .field:first-child{grid-column:auto}}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--lagoon);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-media{position:relative;aspect-ratio:3/2;max-width:100%;background:#26332e;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-media img{transform:scale(1.04)}
.card-open{all:unset;cursor:pointer;display:block}
.card-open:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.badge{position:absolute;left:12px;top:12px;background:rgba(244,241,234,.94);color:#15211d;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.badge.rent{background:#1d3a32;color:#f4f1ea}
.fav{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(244,241,234,.94);color:#15211d;display:grid;place-items:center;cursor:pointer;z-index:2}
.fav[aria-pressed="true"] svg{fill:#b4442e;stroke:#b4442e}
.card-body{padding:16px 16px 18px;display:grid;gap:8px;flex:1}
.card-top{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.card h3{font-size:1.38rem}
.price{font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.price small{font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.specs span{display:inline-flex;align-items:center;gap:6px}
.specs svg{width:16px;height:16px;opacity:.8}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}

/* institutional */
.about{padding-block:56px;background:var(--forest);color:var(--bg)}
.about .eyebrow{color:var(--brass-soft)}
:root .about{--a-muted:color-mix(in srgb,var(--bg) 72%,var(--forest))}
.about-grid{display:grid;gap:36px}
.about h2{font-size:clamp(2rem,6.4vw,3.4rem);max-width:16ch}
.about p{color:var(--a-muted);max-width:58ch;margin:0}
.pillars{display:grid;gap:0;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent)}
.pillar{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;padding:20px 0;border-bottom:1px solid color-mix(in srgb,var(--bg) 22%,transparent)}
.pillar svg{width:26px;height:26px;grid-row:span 2;color:var(--brass-soft);margin-top:2px}
.pillar h3{font-size:1.3rem}
.pillar p{font-size:.94rem}
.todo{display:inline-block;font-family:var(--f-mono);font-size:.72rem;border:1px dashed currentColor;border-radius:6px;padding:3px 8px;opacity:.85}
.bairros{display:flex;flex-wrap:wrap;gap:8px}
.bairros span{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:999px;padding:6px 12px;font-size:.84rem}
@media (min-width:900px){.about-grid{grid-template-columns:1fr 1fr;gap:64px}}

/* contact */
.contact{padding-block:64px}
.contact-grid{display:grid;gap:28px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
.crow:last-child{border-bottom:0;padding-bottom:0}
.crow small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form{display:grid;gap:12px}
.form .two{display:grid;gap:12px}
@media (min-width:560px){.form .two{grid-template-columns:1fr 1fr}}
.notice{background:var(--brass-soft);border-radius:10px;padding:12px 14px;font-size:.9rem}
@media (min-width:900px){.contact-grid{grid-template-columns:.9fr 1.1fr;gap:48px}}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:40px 110px;font-size:.88rem;color:var(--muted)}
.foot-grid{display:grid;gap:28px}
.foot h4{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:0 0 10px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.foot li button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-align:left}
.foot li button:hover{color:var(--ink)}
.legal{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:.78rem;display:grid;gap:6px}
@media (min-width:800px){.foot-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}.foot{padding-bottom:48px}}

/* floating WhatsApp */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);text-decoration:none}
.fab svg{width:28px;height:28px}

/* detail sheet */
.overlay{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:var(--bg);width:100%;max-width:980px;height:100%;overflow-y:auto;overscroll-behavior:contain;animation:up .42s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.overlay{align-items:center;padding:24px}.sheet{height:auto;max-height:calc(100% - 0px);border-radius:18px}}
.sheet-bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
.gallery{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/2;max-width:100%;position:relative;background:#26332e}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide figcaption{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(10,18,15,.6);color:#f4f1ea;padding:5px 8px;border-radius:6px}
.dots{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(244,241,234,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#f4f1ea;width:22px;border-radius:6px}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);display:none}
.gal-nav.l{left:12px}.gal-nav.r{right:12px}
@media (hover:hover){.gal-nav{display:grid}}
.thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
.thumbs button{flex:none;width:76px;aspect-ratio:3/2;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;opacity:.7;background:none}
.thumbs button[aria-current="true"]{border-color:var(--brass);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-body{padding:22px 16px 40px;display:grid;gap:26px}
@media (min-width:900px){.d-body{grid-template-columns:1.5fr 1fr;padding:28px 28px 32px;align-items:start}}
.d-main{display:grid;gap:18px;min-width:0}
.d-main h2{font-size:clamp(1.9rem,6vw,2.6rem)}
.d-loc{color:var(--muted);font-size:.95rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:560px){.kv{grid-template-columns:repeat(4,1fr)}}
.kv div{background:var(--surface);padding:12px 14px}
.kv small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv strong{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.feats{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.feats li{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.86rem;background:var(--surface)}
.d-side{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
@media (min-width:900px){.d-side{position:sticky;top:76px}}
.costs{display:grid;gap:6px;font-size:.9rem}
.costs div{display:flex;justify-content:space-between;gap:12px}
.costs span:first-child{color:var(--muted)}
.d-main h3{font-family:var(--f-body);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d-main p{margin:0;max-width:62ch}
.mini-map{border-radius:12px;overflow:hidden;border:1px solid var(--line);display:block}
.mini-map svg{display:block;width:100%;height:auto}

@keyframes rise{from{opacity:.001;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:.001}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kb{from{transform:scale(1.09)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ============ Renderizador de imagens arquitetônicas (ilustrativas) ============ */
const Painter = (() => {
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix = (a,b,t) => {const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`};
  const SKY = {
    dusk:  {top:'#1a2440',mid:'#5c5a7f',low:'#eaa774',haze:'#a98a92',sun:'rgba(255,186,120,.55)',lit:true, ground:'#1f2c22',plaster:'#bdb3ab',concrete:'#a8a19b',shade:.5},
    golden:{top:'#33608e',mid:'#9fa5b5',low:'#f4c78e',haze:'#c4ab98',sun:'rgba(255,214,150,.6)',lit:true, ground:'#34492f',plaster:'#eadfd2',concrete:'#d5cbc0',shade:.3},
    day:   {top:'#4a83b8',mid:'#8db5d6',low:'#dde9ee',haze:'#a6bfcb',sun:'rgba(255,255,240,.35)',lit:false,ground:'#3e5a37',plaster:'#efeeea',concrete:'#dcdad4',shade:.22}
  };
  let grainPat=null;
  function grain(ctx){
    if(!grainPat){const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');const d=g.createImageData(160,160);
      for(let i=0;i<d.data.length;i+=4){const v=118+Math.random()*20|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);grainPat=c}
    return ctx.createPattern(grainPat,'repeat');
  }
  function sky(ctx,W,hy,s,R){
    const g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,s.top);g.addColorStop(.58,s.mid);g.addColorStop(1,s.low);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,hy+4);
    const r=ctx.createRadialGradient(W*.72,hy,0,W*.72,hy,W*.62);r.addColorStop(0,s.sun);r.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,hy+4);
    ctx.save();ctx.filter='blur(14px)';ctx.globalAlpha=s.lit?.28:.4;
    for(let i=0;i<7;i++){ctx.fillStyle=s.lit?'#f6c9a8':'#ffffff';ctx.beginPath();ctx.ellipse(R()*W,hy*(.15+R()*.45),W*(.08+R()*.14),hy*(.02+R()*.03),0,0,7);ctx.fill()}
    ctx.restore();
  }
  function ridge(ctx,W,hy,base,amp,col,R,peakX,peakW){
    const p=[R()*9,R()*9,R()*9];ctx.beginPath();ctx.moveTo(0,hy+6);
    for(let x=0;x<=W;x+=3){const f=x/W;const n=Math.sin(f*6+p[0])*.35+Math.sin(f*13+p[1])*.16+Math.sin(f*31+p[2])*.06;
      const bump=Math.exp(-Math.pow((x-peakX)/peakW,2));ctx.lineTo(x,base-amp*(.35+n*.6+bump*.9))}
    ctx.lineTo(W,hy+6);ctx.closePath();ctx.fillStyle=col;ctx.fill();
  }
  function canopy(ctx,W,y,R,col,n,size){ctx.fillStyle=col;for(let i=0;i<n;i++){const x=R()*W,r=size*(.5+R());ctx.beginPath();ctx.arc(x,y-r*.3,r,0,7);ctx.fill()}}
  function landscape(ctx,W,H,hy,s,R){
    sky(ctx,W,hy,s,R);
    ridge(ctx,W,hy,hy-H*.02,H*.24,mix(s.haze,s.mid,.25),R,W*.3,W*.18);
    ridge(ctx,W,hy,hy+H*.005,H*.16,mix(s.ground,s.haze,.55),R,W*.78,W*.12);
    ridge(ctx,W,hy,hy+H*.02,H*.08,mix(s.ground,s.haze,.3),R,W*.5,W*.3);
    canopy(ctx,W,hy+H*.02,R,mix(s.ground,'#000000',.15),70,H*.018);
  }
  function glass(ctx,x,y,w,h,s,R,cols){
    const g=ctx.createLinearGradient(0,y,0,y+h);
    if(s.lit){g.addColorStop(0,'#fbe0ae');g.addColorStop(.6,'#e0a35f');g.addColorStop(1,'#93582a')}
    else{g.addColorStop(0,'#a9c3d2');g.addColorStop(.45,'#6c8796');g.addColorStop(1,'#2d3c45')}
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    if(s.lit){
      ctx.fillStyle='rgba(60,32,16,.55)';for(let i=0;i<3;i++){const fx=x+R()*w*.8;ctx.fillRect(fx,y+h*.68,w*(.08+R()*.14),h*.32)}
      ctx.fillStyle='rgba(255,246,220,.95)';for(let i=0;i<Math.max(2,cols-1);i++){const px=x+w*(i+.5)/Math.max(2,cols-1);ctx.beginPath();ctx.arc(px,y+h*.16,Math.max(2,h*.025),0,7);ctx.fill()}
      const gl=ctx.createRadialGradient(x+w/2,y+h*.2,0,x+w/2,y+h*.2,w*.6);gl.addColorStop(0,'rgba(255,240,200,.35)');gl.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=gl;ctx.fillRect(x,y,w,h);
    }else{
      ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.moveTo(x+w*.15,y);ctx.lineTo(x+w*.42,y);ctx.lineTo(x+w*.22,y+h);ctx.lineTo(x-w*.05,y+h);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#1c2023';const m=Math.max(2,w*.006);
    for(let i=0;i<=cols;i++)ctx.fillRect(x+i*w/cols-m/2,y,m,h);
    ctx.fillRect(x,y,w,m);ctx.fillRect(x,y+h-m,w,m);
  }
  function slats(ctx,x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(0,0,0,.28)';const st=Math.max(4,w/38);for(let i=x+st;i<x+w;i+=st)ctx.fillRect(i,y,Math.max(1.2,st*.22),h)}
  function stone(ctx,x,y,w,h,R,s){ctx.fillStyle=mix('#8f857a','#2a2622',s.shade*.6);ctx.fillRect(x,y,w,h);const rh=h/7;
    for(let r=0;r<7;r++){let cx=x-R()*30;while(cx<x+w){const bw=20+R()*42;ctx.fillStyle=mix('#a49a8d','#5d554c',R()*.6+s.shade*.4);ctx.fillRect(cx+1.5,y+r*rh+1.5,Math.min(bw,x+w-cx)-3,rh-3);cx+=bw}}}
  function slab(ctx,x,y,w,h,s){ctx.fillStyle=s.concrete;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x,y+h*.8,w,h*.2)}
  function plants(ctx,x0,x1,y,R,s,size){for(let i=0;i<26;i++){const x=x0+R()*(x1-x0),r=size*(.5+R()*.8);ctx.fillStyle=mix('#2f4a2b','#0d150d',s.shade+R()*.25);ctx.beginPath();ctx.arc(x,y-r*.4,r,0,7);ctx.fill()}}
  function palm(ctx,x,base,h,lean,s){
    const col=mix('#2a3a26','#0a0f0a',s.shade+.25);ctx.strokeStyle=col;ctx.lineWidth=h*.03;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+lean*.35,base-h*.55,x+lean,base-h);ctx.stroke();
    const tx=x+lean,ty=base-h,L=h*.42;ctx.fillStyle=col;
    for(let i=0;i<11;i++){const a=-Math.PI*1.05+i/10*Math.PI*1.1;const ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.55+L*.38;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+Math.cos(a)*L*.5,ty+Math.sin(a)*L*.5-L*.18,ex,ey);
      ctx.quadraticCurveTo(tx+Math.cos(a)*L*.55,ty+Math.sin(a)*L*.45-L*.05,tx,ty);ctx.fill()}
  }
  function house(ctx,W,H,gy,s,R){
    const lh=H*.17,L=W*.12,Rr=W*.86;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(L-W*.02,gy-H*.005,Rr-L+W*.06,H*.02);
    stone(ctx,L,gy-lh,W*.13,lh,R,s);
    glass(ctx,L+W*.13,gy-lh,W*.42,lh,s,R,6);
    slats(ctx,L+W*.55,gy-lh,Rr-L-W*.55,lh,mix('#8a5c37','#2a1a10',s.shade));
    const sy=gy-lh-H*.024;slab(ctx,L-W*.035,sy,Rr-L+W*.07,H*.024,s);
    const uL=W*.29,uR=W*.95,uh=H*.15,uy=sy-uh;
    ctx.fillStyle=s.plaster;ctx.fillRect(uL,uy,uR-uL,uh);
    const sh=ctx.createLinearGradient(0,uy,0,uy+uh);sh.addColorStop(0,'rgba(0,0,0,.18)');sh.addColorStop(.3,'rgba(0,0,0,0)');ctx.fillStyle=sh;ctx.fillRect(uL,uy,uR-uL,uh);
    glass(ctx,uL+W*.04,uy+uh*.1,(uR-uL)*.58,uh*.8,s,R,5);
    slats(ctx,uL+W*.04+(uR-uL)*.58+W*.025,uy+uh*.1,(uR-uL)*.24,uh*.8,mix('#9a6a40','#2a1a10',s.shade));
    slab(ctx,uL-W*.025,uy-H*.022,uR-uL+W*.05,H*.022,s);
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(L,gy-lh,Rr-L,H*.012);
  }
  function tower(ctx,x,top,w,bottom,s,R,floors,dim){
    const fh=(bottom-top)/floors;
    ctx.fillStyle=mix(s.plaster,'#000000',dim+.08);ctx.fillRect(x+w,top+fh*.4,w*.16,bottom-top-fh*.4);
    ctx.fillStyle=mix(s.plaster,'#000000',dim);ctx.fillRect(x,top,w,bottom-top);
    for(let f=0;f<floors;f++){const y=top+f*fh;const n=4;
      for(let k=0;k<n;k++){const wx=x+w*.06+k*(w*.88/n),ww=w*.88/n-w*.02,wy=y+fh*.18,wh=fh*.58;
        const lit=s.lit&&R()<.55;const g=ctx.createLinearGradient(0,wy,0,wy+wh);
        if(lit){g.addColorStop(0,'#fbe2b4');g.addColorStop(1,'#c98a4a')}else{g.addColorStop(0,s.lit?'#3d4553':'#9fb6c5');g.addColorStop(1,s.lit?'#1f242c':'#3b4b57')}
        ctx.fillStyle=g;ctx.fillRect(wx,wy,ww,wh)}
      ctx.fillStyle=mix(s.concrete,'#000000',dim*.6);ctx.fillRect(x-w*.03,y+fh*.78,w*1.06,fh*.12);
      ctx.fillStyle='rgba(190,215,225,.22)';ctx.fillRect(x-w*.03,y+fh*.6,w*1.06,fh*.18);
    }
    ctx.fillStyle=mix(s.concrete,'#000000',dim);ctx.fillRect(x-w*.04,top-fh*.25,w*1.08,fh*.25);
  }
  function post(ctx,W,H,s){
    ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=s.lit?'rgba(255,170,90,.35)':'rgba(120,170,200,.2)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.22;ctx.fillStyle=grain(ctx);ctx.fillRect(0,0,W,H);ctx.restore();
    const v=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
  function exterior(ctx,W,H,o){
    const s=SKY[o.time],R=rng(o.seed);const hy=H*(o.kind==='tower'?.66:.6);
    landscape(ctx,W,H,hy,s,R);
    const gy=H*(o.kind==='tower'?.8:.7);
    const lg=ctx.createLinearGradient(0,hy,0,H);lg.addColorStop(0,mix(s.ground,s.haze,.2));lg.addColorStop(1,mix(s.ground,'#000000',.35));ctx.fillStyle=lg;ctx.fillRect(0,hy+H*.02,W,H);
    let structure;
    if(o.kind==='house') structure=()=>house(ctx,W,H,gy,s,rng(o.seed+7));
    else if(o.kind==='townhouse') structure=()=>{const r=rng(o.seed+7);for(let i=0;i<3;i++){ctx.save();ctx.translate(W*(-.22+i*.3),0);ctx.scale(.62,1);ctx.translate(W*.12,0);house(ctx,W,H*.92,gy,s,r);ctx.restore()}};
    else structure=()=>{const r=rng(o.seed+7);tower(ctx,W*.12,H*.2,W*.2,gy,s,r,10,.3);tower(ctx,W*.5,H*.05,W*.26,gy,s,r,13,.06);};
    plants(ctx,0,W,gy+H*.01,R,s,H*.035);
    structure();
    plants(ctx,W*.05,W*.4,gy+H*.02,R,s,H*.03);
    if(o.pool){
      const py=gy+H*.06,ph=H-py;ctx.fillStyle=mix('#b8a48c','#2a2018',s.shade);ctx.fillRect(0,gy+H*.015,W,H*.05);
      ctx.save();ctx.beginPath();ctx.rect(W*.06,py,W*.88,ph);ctx.clip();
      const pg=ctx.createLinearGradient(0,py,0,H);pg.addColorStop(0,s.lit?'#3c6f7c':'#4fa3b5');pg.addColorStop(1,s.lit?'#14323a':'#1d6476');ctx.fillStyle=pg;ctx.fillRect(0,py,W,ph);
      ctx.globalAlpha=.32;ctx.translate(0,2*gy+H*.07);ctx.scale(1,-1);structure();ctx.restore();
      ctx.save();ctx.globalAlpha=.25;ctx.strokeStyle='#e8f6f8';ctx.lineWidth=1.4;
      for(let i=0;i<60;i++){const y=py+R()*ph,x=W*.06+R()*W*.8;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+20+R()*60,y);ctx.stroke()}ctx.restore();
      ctx.fillStyle=mix('#d9d2c6','#2a2622',s.shade);ctx.fillRect(W*.06,py-H*.008,W*.88,H*.012);
    }else{
      ctx.fillStyle=mix('#b5ab9c','#2a2622',s.shade);ctx.beginPath();ctx.moveTo(W*.42,gy+H*.01);ctx.lineTo(W*.52,gy+H*.01);ctx.lineTo(W*.7,H);ctx.lineTo(W*.36,H);ctx.closePath();ctx.fill();
    }
    if(o.palms){palm(ctx,W*.04,H*1.02,H*.62,W*.05,s);palm(ctx,W*.95,H*1.02,H*.7,-W*.06,s);palm(ctx,W*.9,H*.98,H*.5,W*.03,s)}
    post(ctx,W,H,s);
  }
  function interior(ctx,W,H,o){
    const s=SKY[o.time],R=rng(o.seed);const open=o.kind==='varanda';
    const bx0=W*.17,bx1=W*.83,by0=H*.14,by1=H*.64,vx=W*.5,vy=H*.45;
    ctx.save();ctx.beginPath();ctx.rect(bx0,by0,bx1-bx0,by1-by0);ctx.clip();ctx.translate(bx0,by0);
    landscape(ctx,bx1-bx0,(by1-by0)*1.25,(by1-by0)*.72,s,R);ctx.restore();
    const wall=open?mix('#8a6446','#20150e',s.shade*.6):mix('#e9e3da','#3a352f',s.shade*.7),wall2=open?mix('#7a573b','#1a120c',s.shade*.6):mix('#d8d0c4','#2e2a26',s.shade*.7);
    ctx.fillStyle=wall;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bx0,by0);ctx.lineTo(bx0,by1);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    ctx.fillStyle=wall2;ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(bx1,by0);ctx.lineTo(bx1,by1);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    if(open){ctx.fillStyle='rgba(0,0,0,.25)';for(let i=0;i<22;i++){const t=i/22;ctx.fillRect(t*bx0,0,2,H)}}
    else{ctx.fillStyle=mix('#7b5434','#1a110a',s.shade*.6);ctx.beginPath();ctx.moveTo(W,H*.08);ctx.lineTo(bx1,by0+H*.04);ctx.lineTo(bx1,by1);ctx.lineTo(W,H*.92);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.25)';for(let i=1;i<14;i++){const t=i/14;const x=W+(bx1-W)*t;ctx.fillRect(x,by0+H*.04+(H*.08-by0-H*.04)*(1-t),1.6,(by1-by0)+((H*.92-H*.08)-(by1-by0-H*.04))*(1-t))}}
    ctx.fillStyle=open?mix('#9a7552','#20150e',s.shade*.5):mix('#f4f1ec','#3c3832',s.shade*.6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(bx1,by0);ctx.lineTo(bx0,by0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,236,200,.9)';for(let i=0;i<3;i++){const t=.3+i*.25;ctx.beginPath();ctx.ellipse(vx+(i-1)*W*.18*(1-t*.3),by0*(1-t)+4,W*.02,H*.006,0,0,7);ctx.fill()}
    ctx.save();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(bx0,by1);ctx.lineTo(bx1,by1);ctx.lineTo(W,H);ctx.closePath();ctx.clip();
    const fg=ctx.createLinearGradient(0,by1,0,H);fg.addColorStop(0,mix(open?'#a8916f':'#b48a5e','#1c140c',s.shade*.6));fg.addColorStop(1,mix(open?'#6e5a40':'#6a4a2c','#0c0805',s.shade*.5));ctx.fillStyle=fg;ctx.fillRect(0,by1,W,H);
    ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1.2;const k=(by1-vy)/(H-vy);
    for(let xb=-W*1.5;xb<W*2.5;xb+=W*.045){ctx.beginPath();ctx.moveTo(xb,H);ctx.lineTo(vx+(xb-vx)*k,by1);ctx.stroke()}
    ctx.fillStyle=s.lit?'rgba(255,200,140,.18)':'rgba(255,255,255,.16)';ctx.beginPath();ctx.moveTo(bx0+W*.04,by1);ctx.lineTo(bx1-W*.04,by1);ctx.lineTo(W*.95,H);ctx.lineTo(W*.12,H);ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle='#1b1e20';const m=W*.006;
    if(open){ctx.fillStyle='rgba(200,225,230,.18)';ctx.fillRect(bx0,by1-H*.12,bx1-bx0,H*.12);ctx.fillStyle='#2a2d2f';ctx.fillRect(bx0,by1-H*.125,bx1-bx0,H*.008)}
    else{for(let i=0;i<=4;i++)ctx.fillRect(bx0+i*(bx1-bx0)/4-m/2,by0,m,by1-by0);ctx.fillRect(bx0,by0,bx1-bx0,m);ctx.fillRect(bx0,by1-m,bx1-bx0,m)}
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(W*.5,H*.86,W*.3,H*.06,0,0,7);ctx.fill();
    if(open){
      const chair=(cx)=>{ctx.fillStyle=mix('#e4ddd2','#2a2622',s.shade*.6);ctx.fillRect(cx-W*.09,H*.7,W*.18,H*.07);ctx.fillStyle=mix('#d2c9bb','#222',s.shade*.6);ctx.fillRect(cx-W*.09,H*.6,W*.18,H*.1);ctx.fillStyle='#3a2a1c';ctx.fillRect(cx-W*.085,H*.77,W*.012,H*.04);ctx.fillRect(cx+W*.073,H*.77,W*.012,H*.04)};
      chair(W*.32);chair(W*.68);ctx.fillStyle='#4a3524';ctx.beginPath();ctx.ellipse(W*.5,H*.78,W*.06,H*.018,0,0,7);ctx.fill();ctx.fillRect(W*.495,H*.78,W*.01,H*.06);
    }else{
      ctx.fillStyle=mix('#cfc6b8','#2c2925',s.shade*.6);ctx.fillRect(W*.22,H*.82,W*.56,H*.12);
      ctx.fillStyle=mix('#e6dfd3','#33302b',s.shade*.6);ctx.fillRect(W*.26,H*.6,W*.48,H*.08);ctx.fillRect(W*.24,H*.66,W*.52,H*.1);
      ctx.fillStyle=mix('#d6cdbf','#2b2824',s.shade*.6);for(let i=0;i<3;i++)ctx.fillRect(W*(.28+i*.155),H*.62,W*.14,H*.06);
      ctx.fillStyle=mix('#b7a07e','#2b2418',s.shade*.6);ctx.fillRect(W*.3,H*.64,W*.04,H*.04);ctx.fillRect(W*.66,H*.64,W*.04,H*.04);
      ctx.fillStyle='#3f2d1e';ctx.beginPath();ctx.ellipse(W*.5,H*.86,W*.12,H*.025,0,0,7);ctx.fill();ctx.fillRect(W*.4,H*.86,W*.2,H*.03);
      ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.88,0);ctx.lineTo(W*.88,H*.2);ctx.stroke();
      ctx.fillStyle=s.lit?'#f0c27a':'#2b2b2b';ctx.beginPath();ctx.ellipse(W*.88,H*.22,W*.035,H*.03,0,Math.PI,0);ctx.fill();
      if(s.lit){const lg=ctx.createRadialGradient(W*.88,H*.24,0,W*.88,H*.24,W*.2);lg.addColorStop(0,'rgba(255,215,150,.35)');lg.addColorStop(1,'rgba(255,215,150,0)');ctx.fillStyle=lg;ctx.fillRect(W*.6,0,W*.4,H*.6)}
      ctx.fillStyle='#4a4038';ctx.fillRect(W*.06,H*.74,W*.06,H*.14);ctx.fillStyle=mix('#3d5a34','#0b120a',s.shade*.6);
      for(let i=0;i<9;i++){ctx.beginPath();ctx.ellipse(W*.09+(R()-.5)*W*.08,H*.6+R()*H*.12,W*.012,H*.05,(R()-.5)*1.4,0,7);ctx.fill()}
      ctx.fillStyle=mix('#c9b79a','#2a2520',s.shade*.6);ctx.beginPath();ctx.moveTo(W*.025,H*.26);ctx.lineTo(W*.12,H*.3);ctx.lineTo(W*.12,H*.46);ctx.lineTo(W*.025,H*.46);ctx.closePath();ctx.fill();
    }
    post(ctx,W,H,s);
  }
  const cache=new Map();
  function render(spec,W=1200,H=800){
    const key=JSON.stringify([spec,W,H]);if(cache.has(key))return cache.get(key);
    const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
    (spec.kind==='interior'||spec.kind==='varanda'?interior:exterior)(ctx,W,H,spec);
    let url;try{url=c.toDataURL('image/jpeg',.86)}catch(e){url=''}
    cache.set(key,url);return url;
  }
  return {render};
})();

function Detail({p,onClose,fav,onFav}){
  const specs=[p.img,...p.galeria];const caps=specs.map(s=>s.kind==='interior'?'Interior':s.kind==='varanda'?'Varanda':'Fachada');
  const imgs=specs.map(s=>Painter.render(s,1200,800));
  const [idx,setIdx]=useState(0);const track=useRef(null);const sheet=useRef(null);const closeRef=useRef(null);
  const [sent,setSent]=useState(false);const [form,setForm]=useState({nome:'',tel:'',data:''});const [err,setErr]=useState('');const [copied,setCopied]=useState('');
  useEffect(()=>{const prev=document.activeElement;document.body.style.overflow='hidden';closeRef.current&&closeRef.current.focus();
    const k=e=>{if(e.key==='Escape')onClose()};window.addEventListener('keydown',k);
    return()=>{document.body.style.overflow='';window.removeEventListener('keydown',k);prev&&prev.focus&&prev.focus()}},[]);
  const goTo=i=>{const n=(i+imgs.length)%imgs.length;setIdx(n);const t=track.current;if(t)t.scrollTo({left:n*t.clientWidth,behavior:'smooth'})};
  const onScroll=e=>{const t=e.currentTarget;const n=Math.round(t.scrollLeft/t.clientWidth);if(n!==idx)setIdx(n)};
  const msg=`Olá, Simões Imobiliária! Tenho interesse no imóvel DEMO-${p.id} (${p.tipo} em ${p.bairro}, ${brl(p.preco)}${p.fin==='aluguel'?'/mês':''}).`;
  const submit=e=>{e.preventDefault();if(form.nome.trim().length<2)return setErr('Informe seu nome.');if(form.tel.replace(/\D/g,'').length<10)return setErr('Informe um telefone com DDD, por exemplo (21) 99999-0000.');setErr('');setSent(true)};
  const copy=()=>{const t='Simões Imobiliária · DEMO-'+p.id+' · '+p.titulo;try{navigator.clipboard.writeText(t).then(()=>setCopied('Copiado'),()=>setCopied('Não foi possível copiar'))}catch(e){setCopied('Não foi possível copiar')}};
  return html`<div class="overlay" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
   <div class="sheet" ref=${sheet} role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="sheet-bar">
      <button class="icon-btn" ref=${closeRef} onClick=${onClose} aria-label="Fechar detalhes">${I.close}</button>
      <span class="mono" style=${{fontSize:'.8rem',color:'var(--muted)'}}>DEMO-${p.id} · dados demonstrativos</span>
      <span style=${{display:'flex',gap:'8px'}}>
        <button class="icon-btn" onClick=${copy} aria-label="Copiar referência do imóvel" title=${copied||'Copiar referência'}>${I.share}</button>
        <button class="icon-btn fav" style=${{position:'static',background:'var(--surface)',color:'var(--ink)'}} aria-pressed=${fav} aria-label=${fav?'Remover dos favoritos':'Salvar nos favoritos'} onClick=${()=>onFav(p.id)}>${I.heart}</button>
      </span>
    </div>
    <div class="gallery">
      <div class="slides" ref=${track} onScroll=${onScroll}>
        ${imgs.map((src,i)=>html`<figure class="slide" key=${i} style=${{margin:0}}><img src=${src} alt=${caps[i]+' — ilustração'}/><figcaption>${caps[i]} · imagem ilustrativa</figcaption></figure>`)}
      </div>
      ${imgs.length>1&&html`<button class="icon-btn gal-nav l" onClick=${()=>goTo(idx-1)} aria-label="Imagem anterior">${I.left}</button>
        <button class="icon-btn gal-nav r" onClick=${()=>goTo(idx+1)} aria-label="Próxima imagem">${I.right}</button>
        <div class="dots">${imgs.map((_,i)=>html`<button key=${i} aria-label=${'Imagem '+(i+1)} aria-current=${i===idx} onClick=${()=>goTo(i)}></button>`)}</div>`}
    </div>
    ${imgs.length>1&&html`<div class="thumbs">${imgs.map((src,i)=>html`<button key=${i} aria-current=${i===idx} aria-label=${'Ver '+caps[i]} onClick=${()=>goTo(i)}><img src=${src} alt=""/></button>`)}</div>`}
    <div class="d-body">
      <div class="d-main">
        <div><span class="eyebrow">${p.tipo} · ${p.fin==='venda'?'Venda':'Aluguel'}</span>
          <h2 id="d-title" style=${{marginTop:'8px'}}>${p.titulo}</h2>
          <div class="d-loc">${p.bairro}, Jacarepaguá · Rio de Janeiro</div></div>
        <div class="kv">
          <div><small>Área útil</small><strong class="mono" style=${{fontFamily:'var(--f-display)'}}>${p.area} m²</strong></div>
          <div><small>Quartos</small><strong>${p.quartos||'—'}</strong></div>
          <div><small>Suítes</small><strong>${p.suites||'—'}</strong></div>
          <div><small>Vagas</small><strong>${p.vagas}</strong></div>
        </div>
        <div><h3>Sobre o imóvel</h3><p style=${{marginTop:'8px'}}>${p.desc}</p></div>
        <div><h3 style=${{marginBottom:'10px'}}>Características</h3><ul class="feats">${p.itens.map(t=>html`<li key=${t}>${t}</li>`)}</ul></div>
        <div><h3 style=${{marginBottom:'10px'}}>Localização</h3><${MiniMap} bairro=${p.bairro}/></div>
      </div>
      <aside class="d-side" aria-label="Valores e contato">
        <div><small class="eyebrow">${p.fin==='venda'?'Valor de venda':'Aluguel mensal'}</small><div class="price" style=${{fontSize:'2rem'}}>${brl(p.preco)}${p.fin==='aluguel'&&html`<small> /mês</small>`}</div></div>
        <div class="costs">
          <div><span>Condomínio</span><span class="mono">${p.cond?brl(p.cond):'Não há'}</span></div>
          <div><span>IPTU (mensal)</span><span class="mono">${brl(p.iptu)}</span></div>
        </div>
        <a class="btn btn-wa" href=${waLink(msg)} target="_blank" rel="noopener">${I.wa} Conversar no WhatsApp</a>
        ${sent?html`<div class="notice" role="status"><strong>Pedido de visita registrado nesta demonstração.</strong><br/>Nenhum dado foi enviado. No site final, o pedido chega direto ao WhatsApp ou ao sistema da equipe Simões.</div>`
        :html`<form class="form" onSubmit=${submit} noValidate>
          <strong style=${{fontSize:'.95rem'}}>Agendar visita</strong>
          <div class="field"><label for="v-nome">Nome</label><input id="v-nome" autocomplete="name" value=${form.nome} onInput=${e=>setForm({...form,nome:e.target.value})}/></div>
          <div class="field"><label for="v-tel">Telefone</label><input id="v-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-0000" value=${form.tel} onInput=${e=>setForm({...form,tel:e.target.value})}/></div>
          <div class="field"><label for="v-data">Data preferida</label><input id="v-data" type="date" value=${form.data} onInput=${e=>setForm({...form,data:e.target.value})}/></div>
          ${err&&html`<div role="alert" style=${{color:'#b4442e',fontSize:'.88rem'}}>${err}</div>`}
          <button class="btn btn-dark" type="submit">Solicitar visita</button>
        </form>`}
        <small style=${{color:'var(--muted)',fontSize:'.78rem'}}>Valores, medidas e imagens desta prévia são demonstrativos e não correspondem a um anúncio real.</small>
      </aside>
    </div>
   </div></div>`;
}

function About(){
  const pillars=[[I.map,'Especialistas na região','Atuação concentrada em Jacarepaguá e bairros vizinhos, com leitura de cada condomínio, rua e microlocalização.'],
    [I.key,'Venda, compra e locação','Da avaliação do imóvel à entrega das chaves, com acompanhamento de um corretor do início ao fim.'],
    [I.doc,'Documentação em ordem','Apoio na análise de documentos, certidões e contratos para uma negociação segura.']];
  return html`<section class="about" id="sobre" aria-labelledby="t-sobre"><div class="wrap about-grid">
    <div style=${{display:'grid',gap:'20px',alignContent:'start'}}>
      <span class="eyebrow">A imobiliária</span>
      <h2 id="t-sobre">Uma imobiliária de bairro, com padrão de atendimento de alto nível.</h2>
      <p>A Simões Imobiliária atende quem quer comprar, vender ou alugar em Jacarepaguá. Este bloco apresenta a história, a equipe e os diferenciais da empresa, com o texto oficial a ser fornecido pela Simões.</p>
      <div style=${{display:'flex',flexWrap:'wrap',gap:'8px'}}><span class="todo">Ano de fundação: a informar</span><span class="todo">CRECI-RJ: a informar</span><span class="todo">Fotos da equipe: a fornecer</span></div>
      <div><p style=${{marginBottom:'10px',fontSize:'.8rem',letterSpacing:'.14em',textTransform:'uppercase'}}>Bairros atendidos (exemplo)</p>
        <div class="bairros">${['Freguesia','Pechincha','Taquara','Anil','Tanque','Curicica','Camorim','Vila Valqueire'].map(b=>html`<span key=${b}>${b}</span>`)}</div></div>
    </div>
    <div class="pillars">${pillars.map(([ic,t,d])=>html`<div class="pillar" key=${t}>${ic}<h3>${t}</h3><p>${d}</p></div>`)}</div>
  </div></section>`;
}

function Contact(){
  const [f,setF]=useState({nome:'',tel:'',assunto:'Quero comprar',msg:''});const [sent,setSent]=useState(false);const [err,setErr]=useState('');
  const submit=e=>{e.preventDefault();if(f.nome.trim().length<2)return setErr('Informe seu nome.');if(f.tel.replace(/\D/g,'').length<10)return setErr('Informe um telefone com DDD.');setErr('');setSent(true)};
  return html`<section class="contact" id="contato" aria-labelledby="t-contato"><div class="wrap contact-grid">
    <div style=${{display:'grid',gap:'18px',alignContent:'start'}}>
      <span class="eyebrow">Contato</span><h2 id="t-contato" style=${{fontSize:'clamp(2rem,6vw,3.2rem)'}}>Fale com um corretor</h2>
      <p style=${{margin:0,color:'var(--muted)',maxWidth:'46ch'}}>Atendimento por WhatsApp, telefone ou presencialmente. Os dados abaixo serão substituídos pelos canais oficiais da Simões.</p>
      <div class="cbox">
        <div class="crow"><div><small>WhatsApp</small><span class="mono">(21) ·····-···· a confirmar</span></div><a class="btn btn-wa" href=${waLink('Olá, Simões Imobiliária! Gostaria de atendimento.')} target="_blank" rel="noopener">${I.wa} Abrir</a></div>
        <div class="crow"><div><small>Telefone</small><span class="mono">(21) ····-···· a confirmar</span></div></div>
        <div class="crow"><div><small>E-mail</small><span class="mono">a confirmar</span></div></div>
        <div class="crow"><div><small>Endereço</small><span>Jacarepaguá, Rio de Janeiro · endereço completo a confirmar</span></div></div>
        <div class="crow"><div><small>Horário</small><span>A confirmar com a equipe</span></div></div>
      </div>
    </div>
    <div class="cbox" style=${{alignContent:'start'}}>
      ${sent?html`<div class="notice" role="status"><strong>Mensagem registrada nesta demonstração.</strong><br/>Nada foi enviado. No site final, este formulário encaminha o contato para o WhatsApp ou o e-mail da imobiliária.</div>
        <button class="btn btn-ghost" onClick=${()=>{setSent(false);setF({nome:'',tel:'',assunto:'Quero comprar',msg:''})}}>Enviar outra mensagem</button>`
      :html`<form class="form" onSubmit=${submit} noValidate>
        <strong>Deixe seu contato</strong>
        <div class="two">
          <div class="field"><label for="c-nome">Nome</label><input id="c-nome" autocomplete="name" value=${f.nome} onInput=${e=>setF({...f,nome:e.target.value})}/></div>
          <div class="field"><label for="c-tel">Telefone / WhatsApp</label><input id="c-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-0000" value=${f.tel} onInput=${e=>setF({...f,tel:e.target.value})}/></div>
        </div>
        <div class="field"><label for="c-assunto">Assunto</label><select id="c-assunto" value=${f.assunto} onChange=${e=>setF({...f,assunto:e.target.value})}>
          ${['Quero comprar','Quero alugar','Quero vender meu imóvel','Quero anunciar para locação','Outro assunto'].map(o=>html`<option key=${o}>${o}</option>`)}</select></div>
        <div class="field"><label for="c-msg">Mensagem</label><textarea id="c-msg" rows="4" placeholder="Conte o que você procura: bairro, número de quartos, faixa de valor." value=${f.msg} onInput=${e=>setF({...f,msg:e.target.value})}></textarea></div>
        ${err&&html`<div role="alert" style=${{color:'#b4442e',fontSize:'.88rem'}}>${err}</div>`}
        <button class="btn btn-dark" type="submit">Enviar mensagem</button>
      </form>`}
    </div>
  </div></section>`;
}

function Footer({onOpen}){
  return html`<footer class="foot"><div class="wrap">
    <div class="foot-grid">
      <div style=${{display:'grid',gap:'12px',alignContent:'start'}}><${Brand} onClick=${()=>window.scrollTo({top:0,behavior:'smooth'})}/><p style=${{margin:0,maxWidth:'36ch'}}>Compra, venda e locação de imóveis em Jacarepaguá, Rio de Janeiro.</p></div>
      <div><h4>Navegação</h4><ul><li><button onClick=${()=>scrollToId('imoveis')}>Imóveis</button></li><li><button onClick=${()=>scrollToId('sobre')}>A imobiliária</button></li><li><button onClick=${()=>scrollToId('contato')}>Contato</button></li></ul></div>
      <div><h4>Buscar por bairro</h4><ul>${BAIRROS.slice(1).map(b=>html`<li key=${b}>${b}</li>`)}</ul></div>
      <div><h4>Roteiro da apresentação</h4><ul>
        <li><button onClick=${()=>window.scrollTo({top:0,behavior:'smooth'})}>1. Página inicial e busca</button></li>
        <li><button onClick=${()=>scrollToId('imoveis')}>2. Vitrine com filtros</button></li>
        <li><button onClick=${()=>onOpen('01')}>3. Ficha do imóvel</button></li>
        <li><button onClick=${()=>scrollToId('sobre')}>4. Institucional</button></li>
        <li><button onClick=${()=>scrollToId('contato')}>5. Contato e WhatsApp</button></li></ul></div>
    </div>
    <div class="legal">
      <span>Simões Imobiliária · CRECI-RJ a informar · CNPJ a informar</span>
      <span>Prévia de proposta de site. Imóveis, valores e imagens são demonstrativos, criados para esta apresentação, e não representam anúncios reais. Imagens são ilustrações geradas por computador.</span>
    </div>
  </div></footer>`;
}

const DEFAULT_FILTERS={fin:'todos',tipo:'Todos',bairro:BAIRROS[0],faixa:'',quartos:'0',q:'',ordem:'relevancia',soFav:false};

function App(){
  const [filters,setFilters]=useState(DEFAULT_FILTERS);
  const [favs,setFavs]=useState(()=>{try{return JSON.parse(localStorage.getItem('simoes-favs')||'[]')}catch(e){return[]}});
  const [open,setOpen]=useState(null);
  useEffect(()=>{try{localStorage.setItem('simoes-favs',JSON.stringify(favs))}catch(e){}},[favs]);
  useEffect(()=>{const read=()=>{const m=location.hash.match(/^#imovel-(\d\d)$/);if(m&&IMOVEIS.some(p=>p.id===m[1]))setOpen(m[1]);else if(location.hash.length>1)setTimeout(()=>scrollToId(location.hash.slice(1)),200)};
    read();window.addEventListener('hashchange',read);return()=>window.removeEventListener('hashchange',read)},[]);
  const onFav=useCallback(id=>setFavs(f=>f.includes(id)?f.filter(x=>x!==id):[...f,id]),[]);
  const onSearch=({fin,tipo,bairro})=>{setFilters({...DEFAULT_FILTERS,fin,tipo,bairro});setTimeout(()=>scrollToId('imoveis'),30)};
  const close=()=>{setOpen(null);if(location.hash.startsWith('#imovel-'))try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
  const p=IMOVEIS.find(x=>x.id===open);
  return html`<div class="ribbon"><b>Prévia de proposta</b> · imóveis, valores e imagens demonstrativos</div>
    <${Header}/>
    <main>
      <${Hero} onOpen=${setOpen} onSearch=${onSearch}/>
      <${Listings} filters=${filters} setFilters=${setFilters} favs=${favs} onFav=${onFav} onOpen=${setOpen}/>
      <${About}/>
      <${Contact}/>
    </main>
    <${Footer} onOpen=${setOpen}/>
    <a class="fab" href=${waLink('Olá, Simões Imobiliária! Gostaria de falar com um corretor.')} target="_blank" rel="noopener" aria-label="Falar no WhatsApp">${I.wa}</a>
    ${p&&html`<${Detail} key=${p.id} p=${p} onClose=${close} fav=${favs.includes(p.id)} onFav=${onFav}/>`}`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
